name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync environment
        run: uv sync --extra dev
      - name: Run tests with coverage
        run: uv run pytest --cov=blipb --cov-report=term-missing --cov-fail-under=80
      - name: Lint
        run: uv run ruff check src tests studies validation
