[project]
name = "blipb"
version = "0.1.0"
description = "Power-balance boundary-layer-ingestion (BLI) benefit model with uncertainty quantification: Drela 2009 / Smith 1993 / Hall 2017 unified, low-order, reproducible."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Ansh Pathak", email = "pathakansh10@gmail.com" }]
keywords = [
    "boundary-layer ingestion",
    "power balance",
    "aircraft propulsion",
    "uncertainty quantification",
    "sensitivity analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "SALib>=1.5",
    "chaospy>=4.3",
    "pandas>=2.1,<3",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "pyarrow>=15.0",
    "numpoly==1.2.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/abc000cool/bli-power-balance"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blipb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
